<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Goku · Treino</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Treino do Goku">
    <div class="hud">
      <div class="ki-label"><label for="goku-health">Goku · Vida</label><output id="goku-health-value">100/100</output></div>
      <meter class="health-meter" id="goku-health" min="0" max="100" value="100"></meter>
      <div class="ki-label"><label for="ki">KI</label><output id="ki-value" for="ki">0%</output></div>
      <meter id="ki" min="0" max="100" value="0">0%</meter>
    </div>
    <template id="enemy-health-template">
      <meter class="enemy-health health-meter" aria-label="Vida do Cell Jr." min="0" max="60" value="60"></meter>
    </template>
    <button id="fullscreen" type="button" aria-label="Tela cheia" title="Tela cheia">⛶</button>
    <button id="pause" type="button" aria-label="Pausar" title="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>
    <canvas id="arena" aria-label="Arena marcial entre penhascos"></canvas>
    <p id="status" role="status">Carregando sprites…</p>
    <p id="defeat" role="status" hidden>Goku foi derrotado. Atualize a página para tentar de novo.</p>
    <p id="combat-notice" role="status" hidden></p>
    <div class="controls">
      <div id="joystick" role="group" aria-label="Joystick de movimento" aria-description="Arraste para mover, olhar para cima ou para baixo, ou controlar o voo. Também funciona com as setas do teclado.">
        <span class="stick-thumb" aria-hidden="true"></span>
      </div>
      <div class="actions" role="group" aria-label="Ações">
        <button type="button" data-action="punch">Soco</button>
        <button type="button" data-action="kick">Chute</button>
        <button type="button" data-action="blast" aria-label="Disparar esfera de ki (custa 10)">Poder</button>
        <button type="button" data-action="jump" aria-description="Dois toques rápidos para voar ou pousar" aria-pressed="false">Pular</button>
        <button type="button" data-action="charge">Ki</button>
        <button type="button" data-action="beam" aria-label="Kamehameha (custa 40 de ki)">Kame</button>
        <button id="transform" type="button" data-action="transform" aria-label="Transformar em Super Saiyajin" hidden>SSJ</button>
      </div>
    </div>
    <button id="pick-up" type="button" hidden>Pegar</button>
    <div class="inventory" role="group" aria-label="Inventário">
      <button id="seed-slot" class="inventory-slot" type="button" aria-label="Usar Semente dos Deuses" title="Usar Semente dos Deuses" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#153d2c" d="M7 1h6v2h2v6h-2v3h-3v2H4v-2H2V6h2V3h3z"/>
          <path fill="#4cba63" d="M7 3h6v6h-2v3H4V6h3z"/>
          <path fill="#b7eb77" d="M8 4h4v3h-2v2H6V6h2z"/>
        </svg>
        <span id="seed-count"></span>
      </button>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
    </div>
    <dialog id="pause-menu" aria-label="Jogo pausado">
      <button id="restart" type="button" aria-label="Reiniciar" title="Reiniciar" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10h-2"/>
        </svg>
      </button>
    </dialog>
  </main>
  <section class="orientation" aria-label="Orientação da tela">
    <div class="phone" aria-hidden="true"></div>
    <h1>Gire o celular</h1>
    <p>Jogue com a tela na horizontal.</p>
  </section>
</body>
</html>
