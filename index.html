<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Goku · Treino</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Treino do Goku">
    <div class="hud">
      <div class="ki-label"><label for="goku-health">Goku · Vida</label><output id="goku-health-value">100/100</output></div>
      <meter class="health-meter" id="goku-health" min="0" max="100" value="100"></meter>
      <div class="ki-label"><label for="ki">KI</label><output id="ki-value" for="ki">0%</output></div>
      <meter id="ki" min="0" max="100" value="0">0%</meter>
    </div>
    <template id="enemy-health-template">
      <meter class="enemy-health health-meter" aria-label="Vida do Cell Jr." min="0" max="60" value="60"></meter>
    </template>
    <button id="fullscreen" type="button" aria-label="Tela cheia" title="Tela cheia">⛶</button>
    <button id="pause" type="button" aria-label="Pausar" title="Pausar">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16" rx="1"/>
        <rect x="14" y="4" width="4" height="16" rx="1"/>
      </svg>
    </button>
    <canvas id="arena" aria-label="Arena marcial entre penhascos"></canvas>
    <p id="status" role="status">Carregando sprites…</p>
    <p id="defeat" role="status" hidden>Goku foi derrotado. Atualize a página para tentar de novo.</p>
    <p id="combat-notice" role="status" hidden></p>
    <p id="wave-status" role="status">Onda 1/3 · Prepare-se</p>
    <p id="stage-complete" role="status" hidden>Fase concluída</p>
    <div class="controls">
      <div id="joystick" role="group" aria-label="Joystick de movimento" aria-description="Arraste para mover, olhar para cima ou para baixo, ou controlar o voo. Também funciona com as setas do teclado.">
        <span class="stick-thumb" aria-hidden="true"></span>
      </div>
      <div class="actions" role="group" aria-label="Ações">
        <button type="button" data-action="punch" aria-label="Soco" title="Soco">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 27v-4l-4-5v-4a2.4 2.4 0 0 1 4.8 0V8a2.2 2.2 0 0 1 4.4 0V6a2.2 2.2 0 0 1 4.4 0v1a2.2 2.2 0 0 1 4.4 0v2a2.2 2.2 0 0 1 4.4 0v8.5a7 7 0 0 1-2 5L24 24v3z"/>
            <path d="M14.2 8v6m4.4-7v7M23 9v5M9.8 15l4.6 3.1a2.3 2.3 0 0 0 3.3-.6l1.2-1.7-4-2.7"/>
          </svg>
        </button>
        <button type="button" data-action="kick" aria-label="Chute" title="Chute">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <g fill="currentColor" stroke="none" transform="rotate(22 16 16)">
              <path d="M17.1 12.2c-3.9-1-7.2 1.7-7.2 5.1 0 2.4 1.5 4.1 2 5.6.5 1.4.3 2.8 1.3 4a3.4 3.4 0 0 0 5.9-1.7c.2-1.5-.5-3.2 0-4.8.4-1.4 1.7-2.8 1.5-4.8-.2-1.6-1.5-2.9-3.5-3.4z"/>
              <ellipse cx="19.2" cy="6.4" rx="2.8" ry="3.4"/>
              <ellipse cx="13.2" cy="6.9" rx="2" ry="2.6"/>
              <circle cx="9" cy="9.5" r="1.8"/>
              <circle cx="6.7" cy="13" r="1.4"/>
            </g>
          </svg>
        </button>
        <button type="button" data-action="blast" aria-label="Disparar esfera de ki (custa 10)" title="Poder">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="21.5" cy="10.5" r="6.5"/>
            <circle cx="21.5" cy="10.5" r="2.4" fill="currentColor" stroke="none"/>
            <circle cx="10" cy="22.5" r="5.5"/>
            <circle cx="10" cy="22.5" r="1.8" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button type="button" data-action="jump" aria-label="Pular" title="Pular" aria-description="Dois toques rápidos para voar ou pousar" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="m7.5 13.5 8.5-8 8.5 8m-17 11 8.5-8 8.5 8"/>
          </svg>
        </button>
        <button type="button" data-action="charge" aria-label="Ki" title="Carregar ki" hidden>
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 29c-6.3 0-10.1-4.1-10.1-9.3 0-3.3 1.5-6 3.4-8.4.1 2 .7 3.1 1.7 4 1.3-4.4 4.8-5.9 5.1-12.3 3.2 3 4.5 6.3 4.4 10.2 1.2-.7 2-1.8 2.4-3.3 2.2 3.3 3.3 6.6 3.3 9.8C26.2 25 22 29 16 29Z"/>
            <path d="M16 29c-3.3 0-4.7-2.4-4.7-4.8 0-3.1 3.2-4.3 4.7-7.5 1 2.8 4.6 4.4 4.6 7.5 0 2.4-1.6 4.8-4.6 4.8Z"/>
          </svg>
        </button>
        <button type="button" data-action="beam" aria-label="Kamehameha (custa 40 de ki)" title="Kamehameha">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M14.3 11.5H29v9H14.3m3-4.5H29"/>
            <circle cx="9.5" cy="16" r="6.5"/>
            <circle cx="9.5" cy="16" r="2.4" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button id="transform" type="button" data-action="transform" aria-label="Transformar em Super Saiyajin" hidden>SSJ</button>
      </div>
    </div>
    <button id="pick-up" type="button" hidden>Pegar</button>
    <div class="inventory" role="group" aria-label="Inventário">
      <button id="seed-slot" class="inventory-slot" type="button" aria-label="Usar Semente dos Deuses" title="Usar Semente dos Deuses" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="#153d2c" d="M7 1h6v2h2v6h-2v3h-3v2H4v-2H2V6h2V3h3z"/>
          <path fill="#4cba63" d="M7 3h6v6h-2v3H4V6h3z"/>
          <path fill="#b7eb77" d="M8 4h4v3h-2v2H6V6h2z"/>
        </svg>
        <span id="seed-count"></span>
      </button>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
      <span class="inventory-slot" aria-hidden="true"></span>
    </div>
    <dialog id="pause-menu" aria-label="Jogo pausado">
      <button id="restart" type="button" aria-label="Reiniciar" title="Reiniciar" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10h-2"/>
        </svg>
      </button>
    </dialog>
  </main>
  <section class="orientation" aria-label="Orientação da tela">
    <div class="phone" aria-hidden="true"></div>
    <h1>Gire o celular</h1>
    <p>Jogue com a tela na horizontal.</p>
  </section>
</body>
</html>
